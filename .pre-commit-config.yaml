# Run `uv run pre-commit install` once; hooks then run on every `git commit`.
# Run on everything: `uv run pre-commit run --all-files`
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=5000]   # raw data / outputs must stay out of git
      - id: mixed-line-ending
        args: [--fix=lf]

  # ruff is run from the project venv so the version always matches uv.lock.
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint, auto-fix)
        entry: uv run --frozen ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.7.6
    hooks:
      - id: uv-lock         # keep uv.lock in sync with pyproject.toml
