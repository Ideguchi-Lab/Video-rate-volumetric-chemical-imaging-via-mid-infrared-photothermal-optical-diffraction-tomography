[project]
name = "mipodt-paper"
version = "0.1.0"
description = "Code to reproduce the figures of 'Video-rate volumetric chemical imaging via mid-infrared photothermal optical diffraction tomography'"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "tifffile>=2024.8",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mipodt_paper"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16",
]
