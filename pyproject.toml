[project]
name = "mipodt-paper"
version = "0.1.0"
description = "Code to reproduce the figures of 'Video-rate volumetric chemical imaging via mid-infrared photothermal optical diffraction tomography'"
authors = [{ name = "Ideguchi Lab." }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "tifffile>=2024.8",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "h5py>=3.11",
    "scikit-learn>=1.5",
    "pt3d==1.0.0",
    "muscopy[cuda]==1.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mipodt_paper"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.uv.sources]
pt3d = { path = "submodules/ParticleTracker" }

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16",
]
