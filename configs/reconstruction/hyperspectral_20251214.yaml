# Accepted-paper MIP-ODT reconstruction for the 2025-12-14 COS-7 hyperspectral data.
schema_version: 1
dataset_id: hyperspectral_20251214

acquisition:
  # Per-volume calibration timestamps are recorded in the volume manifest.
  frame_interval_s: null

input:
  # image_dir is relative to MIPODT_DATA_DIR (defaults to ./data).
  image_dir: fig3_multispectral/hyperspectral_raw
  # Both manifests are repository-relative and tracked with the analysis code.
  pairing_csv: manifests/hyperspectral_20251214_pairings.csv
  # Its volume_id column defines the paper analysis subset and the default reconstruction selection.
  volume_manifest_csv: manifests/hyperspectral_20251214_volumes.csv

optical:
  objective_na: 1.2
  illumination_na: 0.85
  wavelength_nm: 532.0
  camera_pixel_size_um: 9.0
  magnification: 166.66666666666666
  medium_refractive_index: 1.33
  image_size_px: 1088
  # NumPy axis order used by muscopy.get_spectrum().
  offaxis_center_px: [846, 226]

reconstruction:
  approximation: Rytov
  linear_approximation: true
  hermite_symmetry: true
  edge_size_px: 5

  # Signal-fidelity settings frozen for the paper reconstruction.
  use_skimage_unwrap: true
  gradient_correction: false
  offset_regions: null

  ewald_embedding_mode: truncate
  integer_precision_bits: 16
  float_precision_bits: 32
  verbose: true

output:
  # Relative to MIPODT_RECONSTRUCTION_DIR (defaults to ./reconstructions).
  directory: fig3_multispectral/mipodt
  filename_pattern: mipodt_r_{volume_id:03d}.npy

preview:
  volume_id: 20
  z_indices: [132]
  colormap: inferno
  vmin: -0.0005
  vmax: 0.004
  formats: [png, pdf]
