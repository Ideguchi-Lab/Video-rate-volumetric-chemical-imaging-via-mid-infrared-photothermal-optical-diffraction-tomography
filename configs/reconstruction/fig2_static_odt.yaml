# Static ODT reconstruction for the Fig. 2 resolution analysis.
schema_version: 1
dataset_id: fig2_static_odt

input:
  image_dir: fig2_resolution
  pairing_csv: manifests/fig2_resolution_static_pairs.csv

optical:
  objective_na: 1.2
  illumination_na: 1.0
  wavelength_nm: 532.0
  camera_pixel_size_um: 9.0
  magnification: 166.66666666666666
  medium_refractive_index: 1.33
  image_size_px: 1088
  offaxis_center_px: [840, 228]

reconstruction:
  approximation: Rytov
  linear_approximation: true
  hermite_symmetry: true
  edge_size_px: 5
  use_skimage_unwrap: true
  spectrum_placement: legacy
  gradient_correction: false
  offset_regions: null
  ewald_embedding_mode: truncate
  integer_precision_bits: 16
  float_precision_bits: 32
  verbose: true

output:
  path: fig2_resolution/static_odt/odt_cell.npy
