schema_version: 1
figure_id: fig3_multispectral

data:
  # All paths are relative to MIPODT_DATA_DIR unless explicitly marked repository-relative.
  mipodt_directory: fig3_multispectral/mipodt
  mipodt_filename_regex: 'mipodt_r_(?P<volume_id>\d{3})\.npy'
  static_odt_path: fig3_multispectral/static_odt/odt_cell.npy
  reference_sources_path: fig3_multispectral/references/reference_sources.yaml
  volume_metadata_repository_path: manifests/hyperspectral_20251214_volumes.csv
  expected_volume_ids: {start: 0, stop: 42}
  expected_shape: [535, 535, 267]
  expected_dtype: float32

array_convention:
  order: [axis0, axis1, z]
  display_horizontal_axis: axis1
  display_vertical_axis: axis0
  roi_intervals: half-open

sampling:
  xy_um_per_pixel: 0.110
  z_um_per_pixel: 0.220
  medium_refractive_index: 1.33

rois:
  lipid_droplet: {axis0: [325, 328], axis1: [145, 148], z: [135, 137]}
  er_mixed: {axis0: [261, 276], axis1: [230, 237], z: [132, 136]}
  nucleolus: {axis0: [300, 321], axis1: [310, 331], z: [136, 141]}

odt_slices:
  z_indices: [135, 140]
  crop: {axis0: [150, 450], axis1: [100, 400]}
  cmap: Greys_r
  # Absolute RI: delta_n range [-0.003, 0.03] plus medium RI 1.33.
  display_range: [1.327, 1.360]
  figsize_per_slice: [4.0, 3.5]
  title: ODT
  font_family: Arial
  title_fontsize: 24
  z_label_fontsize: 24
  colorbar_fontsize: 20
  colorbar_title_fontsize: 24
  scalebar_um: 10.0
  scalebar_fontsize: 20
  arrows:
    length_um: 5.0
    head_width_um: 2.0
    head_length_um: 1.5
    linewidth: 3.0
    offset_angle_deg: -135.0
    colors: {lipid_droplet: "#1f77b4", er_mixed: "#ff7f0e", nucleolus: "#2ca02c"}

mipodt_slices:
  # Use the same seed-reconstructed volumes as the ROI spectra, normalized once by power.
  source: reconstructed_volumes
  volume_ids: [25, 23, 14]
  z_indices: [135, 140]
  crop: {axis0: [150, 450], axis1: [100, 400]}
  cmap: inferno
  # Each row shares a scale across both crops, with a minimum upper limit for volume 14.
  vmin: 0.0
  vmax_percentile: 100.0
  row_vmax_floors: {"14": 0.00006}
  scalebar_um: 10.0

spectra:
  volume_ids: {start: 14, stop: 36}
  wavenumber_correction_cm_inv: -12.5

nnls:
  analysis_range_cm_inv: [2800.0, 3100.0]
  asls: {lambda: 1.0e5, p: 0.01, iterations: 20}
  area_and_fit_range_cm_inv: [2830.0, 3027.0]
  common_resolution_fwhm_cm_inv: 16.0
  common_grid_step_cm_inv: 0.5
  minimum_fit_points: 8
  regions:
    nucleolus: [bsa, guanosine, oleic_acid]
    lipid_droplet: [oleic_acid, cholesterol]

plot:
  dpi: 300
  font_size: 10
  spectrum_styles:
    lipid_droplet: {color: "#1f77b4", marker: o, linestyle: "-", label: Region 1}
    er_mixed: {color: "#ff7f0e", marker: s, linestyle: "--", label: Region 2}
    nucleolus: {color: "#2ca02c", marker: "^", linestyle: "-.", label: Region 3}
  lipid_nucleolus_ylim: [-0.00001, 0.000105]
  measurement_time_ylim_ms: [0.0, 1150.0]
  nnls_styles:
    nucleolus:
      title: Nucleolus
      marker: "^"
      markersize: 6
      color: "#20a85b"
      reference_colors: {bsa: "#8fca10", guanosine: "#ffb52e", oleic_acid: "#8f5a99"}
      ratio_order: [oleic_acid, guanosine, bsa]
    lipid_droplet:
      title: Lipid droplet
      marker: o
      markersize: 3.2
      color: "#1f77b4"
      reference_colors: {oleic_acid: "#8fca10", cholesterol: "#ffb52e"}
      ratio_order: [oleic_acid, cholesterol]

output:
  cache: analysis_cache.npz
  formats: [png, eps]
  bmp_image_panels: [odt_roi_slices, mipodt_slices]
