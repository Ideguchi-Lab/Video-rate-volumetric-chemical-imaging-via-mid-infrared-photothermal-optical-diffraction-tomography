data:
  # Distributed voxel-wise noise STD of the 2025-12-12 MIR-off sequence, (x, y, z) float32.
  noise_std:
    path: suppfig2_noise_std/noise_std/std_result.npy
  # MIR-off MIP-ODT volumes consumed by `run.py --compute-std` (generated by the reconstruction step).
  mipodt:
    directory: suppfig2_noise_std/mipodt
    filename_glob: mipodt_r_*.npy
    accumulation_dtype: float32
  expected_shape: [535, 535, 267]
  axis_order: xyz

noise_region:
  # ROI averaged to report the noise floor (NumPy half-open indices).
  output_csv: region_noise_mean.csv
  regions:
    - name: roi_center
      x: {start: 80, end: 470}
      y: {start: 80, end: 470}
      z: {start: 117, end: 147}

z_slices:
  output_prefix: noise_std_3d
  z_indices: [140, 134, 129, 124]
  crop_xy: [80, 470, 80, 470]
  cmap: viridis
  vmin: null
  vmax: 0.0001
  title: Noise STD Distribution
  colorbar_label: Noise STD in RI change
  colorbar_scientific: true
  pixel_size_xy_nm: 110
  pixel_size_z_nm: 220
  figsize_width: 6.0
  figsize_height: 5.0
  dpi: 300
  scalebar_um: 10.0
  scalebar_color: white
  scalebar_linewidth: 3.0
  font:
    family: Arial
    size_title: 26
    size_colorbar_label: 24
    size_colorbar_tick: 20
    size_scalebar: 22
